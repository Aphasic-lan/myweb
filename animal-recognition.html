<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动物识别 - 拍照识物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#F5F5F5',
                        textMain: '#333333',
                        textSub: '#666666',
                    },
                    fontFamily: {
                        sans: ['PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            }
            .btn-gradient {
                background: linear-gradient(90deg, #FF6B35 0%, #FF8C60 100%);
            }
        }
    </style>
</head>

<body class="bg-[#FAFAFA] font-sans text-textMain">
    <div class="max-w-md mx-auto min-h-screen bg-white p-4">
        <div class="flex items-center mb-5">
            <a href="home.html" class="text-primary text-xl mr-4">
                <i class="fa fa-arrow-left"></i>
            </a>
            <h1 class="text-2xl font-bold">动物识别</h1>
        </div>

        <div class="bg-white rounded-2xl card-shadow p-4 mb-6">
            <div id="image-preview"
                class="w-full h-60 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center mb-4">
                <i class="fa fa-camera text-gray-400 text-5xl mb-2"></i>
                <p class="text-textSub">点击上传图片或拍照识别</p>
                <input type="file" id="image-upload" accept="image/*" capture="environment" class="hidden">
                <button id="select-image" class="mt-3 bg-primary text-white px-4 py-2 rounded-full">
                    选择图片
                </button>
            </div>
            <img id="preview-img" class="w-full h-60 object-cover rounded-xl hidden" alt="预览图片">

            <button id="recognize-btn"
                class="w-full btn-gradient text-white py-3 rounded-full font-medium mt-4 shadow-lg hidden">
                <i class="fa fa-search mr-2"></i>开始识别
            </button>
        </div>

        <div id="result-area" class="bg-white rounded-2xl card-shadow p-4 hidden">
            <h2 class="text-xl font-bold mb-3">识别结果</h2>
            <div id="result-content" class="space-y-3">
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const selectImageBtn = document.getElementById('select-image');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const recognizeBtn = document.getElementById('recognize-btn');
        const resultArea = document.getElementById('result-area');
        const resultContent = document.getElementById('result-content');

        selectImageBtn.addEventListener('click', () => {
            imageUpload.click();
        });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.classList.add('hidden');
                    previewImg.src = event.target.result;
                    previewImg.classList.remove('hidden');
                    recognizeBtn.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        recognizeBtn.addEventListener('click', async () => {
            const file = imageUpload.files[0];
            if (!file) return;

            recognizeBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>识别中...';
            recognizeBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch('http://localhost:8000/recognize-animal', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                resultArea.classList.remove('hidden');
                if (result.success) {
                    resultContent.innerHTML = `
                        <div class="p-3 bg-green-50 rounded-lg">
                            <h3 class="font-bold text-lg">${result.data.name}</h3>
                            <p class="text-textSub mt-1">相似度: ${(result.data.confidence * 100).toFixed(2)}%</p>
                            <p class="text-textSub mt-2">简介: ${result.data.description || '暂无描述'}</p>
                        </div>
                    `;
                } else {
                    resultContent.innerHTML = `
                        <div class="p-3 bg-red-50 rounded-lg text-red-500">
                            <i class="fa fa-exclamation-circle mr-2"></i>${result.message}
                        </div>
                    `;
                }
            } catch (error) {
                resultArea.classList.remove('hidden');
                resultContent.innerHTML = `
                    <div class="p-3 bg-red-50 rounded-lg text-red-500">
                        <i class="fa fa-exclamation-circle mr-2"></i>识别失败，请重试
                    </div>
                `;
                console.error('识别错误:', error);
            } finally {
                recognizeBtn.innerHTML = '<i class="fa fa-search mr-2"></i>开始识别';
                recognizeBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
